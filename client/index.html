<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="Bookland — search millions of books, research papers, and articles from the world's open libraries and read them right here. Every book. Every idea. Found." />
    <meta property="og:title" content="Bookland — Every book. Every idea. Found." />
    <meta property="og:description" content="Search millions of books, papers, and articles from the world's open libraries — and read them right here." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bookland" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Bookland — Every book. Every idea. Found.</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('bookland-theme');
          var theme = raw ? (JSON.parse(raw).state || {}).theme : 'system';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add(theme);
          document.documentElement.style.backgroundColor = theme === 'dark' ? '#000000' : '#f5f5f7';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
