<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookland</title>
    <script>
      if (location.pathname.endsWith('/BookLand/') || location.pathname.includes('/BookLand')) {
        location.replace(location.origin + '/BookLand/#/');
      } else {
        location.replace('./#/');
      }
    </script>
  </head>
  <body>
    <p style="font-family: system-ui, sans-serif; text-align: center; padding-top: 20vh">
      Redirecting to Bookland…
    </p>
  </body>
</html>
